<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>tic_tac_toe</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>

<body>
    <h1>TIC TAC TOE</h1>
    <div id="scoreBoard">
        <div id="scoreGroups">
            <div class="scores" id="scoreX">
                <div>X</div>
                <div id="updtX"></div>
            </div>
            <div class="scores" id="scoreO">
                <div>O</div>
                <div id="updtO"></div>
            </div>
            <div class="scores" id="tie">
                <div><i class="fa-solid fa-scale-balanced"></i></div>
                <div id="updtTie"></div>
            </div>
        </div>
    </div>
    <div id="containerBox">
    <div id="container">
        <button class="boxes" id="box0"></button>
        <button class="boxes" id="box1"></button>
        <button class="boxes" id="box2"></button>
        <button class="boxes" id="box3"></button>
        <button class="boxes" id="box4"></button>
        <button class="boxes" id="box5"></button>
        <button class="boxes" id="box6"></button>
        <button class="boxes" id="box7"></button>
        <button class="boxes" id="box8"></button>
        <div id="winLine"></div>
    </div></div>
    <div id="accessories">
        <button id="newButton"><i class="fa-solid fa-arrows-rotate"></i></button>
            <input type="checkbox" id="toogle">
            <label for="toogle" class="button"><i class="fa-solid fa-xmark"></i>
                <i class="fa-solid fa-o"></i></label>
        <button id="resetButton">
            <i class="fa-solid fa-trash-can"></i>
        </button>
    </div>
    <div class="overlay" id="startOverlay">
        <div class="message-box">
            Start the Game with
            <br><br>
                <div id="radioBtnChoseturn">
                <input type="radio" id="radioBtnX" name="choseTurn" value="1">
                <label for="radioBtnX" class="radioLable">X</label>
                <input type="radio" id="radioBtnO" name="choseTurn" value="0">
                <label for="radioBtnO" class="radioLable">O</label>
                </div>
        </div>
        <button id="continue"><i class="fa-solid fa-circle-chevron-right"></i></button>
    </div>
    <script src="app.js"></script>
</body>

</html>
